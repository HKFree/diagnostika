# hkdiag configuration. Copy to ~/.config/hkdiag/config.toml and run:
#   chmod 600 ~/.config/hkdiag/config.toml
# hkdiag refuses to read the file if group/others can access it.
# Every secret can instead be given through an environment variable
# (HKDIAG_FRR_PASSWORD, HKDIAG_USERDB_API_KEY, HKDIAG_USERDB_PASSWORD).

[frr]
host = "10.107.3.1"
port = 2604            # ospfd vty
password = "CHANGE-ME"
timeout_secs = 15
# ospf6d (OSPFv3, IPv6 prefixes), same password. Without it there is no IPv6
# data; the password is never sent to a host that isn't configured here.
ospf6_host = "10.107.31.33"
ospf6_port = 2606

[sojka]
url = "http://sojka.hkfree.org/pinger/"
timeout_secs = 15
lookback_secs = 604800 # IPs not seen alive for 7 days count as stale

# Optional: adds AP names, admin contacts and device descriptions.
[userdb]
url = "https://userdb.hkfree.org/userdb/api"
api_key_id = 0         # HTTP basic user is "apikey<id>"
api_key = "CHANGE-ME"
# Optional member login, used by `diagnose --member` to check membership.
# uid = 1234
# password = "CHANGE-ME"
timeout_secs = 30

# Optional: `hkdiag serve` (PWA + /topology.json + /api/whoami).
# Keep it on localhost; put an HTTPS proxy in front for phones.
[web]
# One address or several, e.g. ["127.0.0.1:9000", "10.107.252.72:9000"].
listen = "127.0.0.1:8087"
trusted_proxies = ["127.0.0.1"]
# Behind Apache, which appends the client to X-Forwarded-For but passes a
# client's own X-Real-IP on unchanged:
# client_ip_header = "x-forwarded-for"
# Public origins whose pages may send outage reports (when the proxy doesn't
# pass the Host header on):
# origins = ["https://diag.hkfree.org"]
topology_cache_secs = 30
# The assistant's language models, mirrored by scripts/mirror-models.py and
# served under /models/ (the app never downloads them from elsewhere).
# models_dir = "/home/jrk/hkdiag/models"
# Reading an antenna's signal logs in to the AP's routers (UserDB Wewimo):
# one AP is read at most once per this many seconds, whoever asks.
signal_cache_secs = 60
# UserDB's status (AP devices with a problem now) is read this often, shown in
# the outage overview and recorded as outages network monitoring measured.
status_poll_secs = 60
# Outages up to this long aren't listed (blips).
min_outage_secs = 900

# Optional: MikroTik routers (RouterOS 7) whose OSPF databases are read beside
# FRR's and merged into the map (newest record first). A border router shows the
# inside of its area; each router also shows its own side of a split and
# whether it has a default route. Use a read-only account (group "read").
# Plain http sends the login unencrypted; prefer https:// where www-ssl runs.
[[mikrotik]]
url = "https://10.107.10.129"
user = "read"
password = "CHANGE-ME"
timeout_secs = 15
retry_after_secs = 300   # after a failure, don't ask this router again for 5 minutes
# insecure_http = true   # only for a router without www-ssl: allows http://, login unencrypted

# Optional: the LibreSpeed backend the app measures the connection's speed
# against, only when the member asks and only over hkfree.org.
[speedtest]
url = "https://speedtest.hkfree.org/backend/"

# Address pools of the hkfree.org VPN: a device there is on hkfree.org, but not
# through its home connection.
[network]
vpn = ["10.107.254.0/24", "2a01:168:0:dead::/64"]

# Where the app sends members for outages older than a day and for history.
[links]
userdb_ap = "https://userdb.hkfree.org/userdb/ap/show/{id}"
userdb_status = "https://userdb.hkfree.org/userdb/status"
monitoring = "http://sojka.hkfree.org/cgi-bin/smokeping.cgi"

# Optional: whom members turn to when the problem is in the network.
[support]
name = "Podpora hkfree.org"
url = "https://hkfree.org"
email = "podpora@hkfree.org"
phone = "608 10 10 70"
phone_hours = "9-17"        # on working days
slack_channel = "#nejdeto"  # on the hkfree.org Slack
