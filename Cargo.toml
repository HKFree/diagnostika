[package]
name = "hkdiag"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Diagnose why a host in the hkfree.org network has no connectivity (OSPF + Sojka + UserDB)"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zeroize = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
