name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust tests (Rust 1.98.1 from rust-toolchain.toml, locked dependencies)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-1.98.1-${{ hashFiles('Cargo.lock') }}
      # rust-toolchain.toml pins the toolchain Verus needs (ADR 0003).
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo test --locked

  verus:
    name: Backend proofs (Verus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verus-0.2026.09.27-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Verus 0.2026.09.27 (pinned by checksum)
        run: |
          curl -sSL -o verus.zip "https://github.com/verus-lang/verus/releases/download/release%2F0.2026.09.27.3cf1832/verus-0.2026.09.27.3cf1832-x86-linux.zip"
          echo "43814031e10df043221d83c7fa842e3ebd662cb7b0090fc1eb4d7a8673226978  verus.zip" | sha256sum -c -
          unzip -q verus.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/verus-x86-linux" >> "$GITHUB_PATH"
      - run: cargo verus verify --locked

  web-and-spec:
    name: Web tests, specification, architecture model, phases
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test web/test/engine.test.mjs
      - name: Specification lint and Czech mirror in sync
        run: sh .githooks/pre-push.d/gherkin.sh
      - name: Architecture model validates
        run: sh .githooks/pre-push.d/likec4.sh
      - name: Commits stay within their phase
        run: sh .githooks/pre-push.d/phases.sh origin

  lemmascript:
    name: Frontend proofs (LemmaScript, Dafny) and compiled JS up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dafny 4.11.0 (pinned by checksum)
        run: |
          curl -sSL -o dafny.zip https://github.com/dafny-lang/dafny/releases/download/v4.11.0/dafny-4.11.0-x64-ubuntu-22.04.zip
          echo "a46a9ff7cdd720f7955854c78e95df13f4cfe6b80691b05f8654fe19e8267179  dafny.zip" | sha256sum -c -
          unzip -q dafny.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"
      - name: Contracts proven (every file in LemmaScript-files.txt)
        run: npx lsc check --backend=dafny
      - name: Compiled JS matches the TypeScript sources
        run: |
          npx tsc -p tsconfig.json
          git diff --exit-code -- web

  bdd:
    name: Executable specification (real server and app in Chrome)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-1.98.1-${{ hashFiles('Cargo.lock') }}
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo build --release --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx cucumber-js
        env:
          BDD_BROWSER: /usr/bin/google-chrome
